<g transform="translate(160 32)"><ellipse cx="16" cy="29" rx="16" ry="2.5" fill="#286f45" opacity=".5"/><path d="M0 25q-2-8 6-11-1-9 8-9 5-6 11 1 8-2 9 8 5 7-2 13H4z" fill="#347f4e" stroke="#1f6847" stroke-width="1.8"/><path d="M4 17q3-8 10-4 3-7 9-3 7-1 9 6-6-3-10 3-6-5-11 1-5-3-9-3z" fill="#54aa63"/><path d="M6 20q4-5 8-2m8-6q4-2 7 2m-8 9q4-4 8-2" fill="none" stroke="#92d66e" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="14" r="1.7" fill="#bee77a"/><circle cx="26" cy="19" r="1.4" fill="#f0cf72"/></g>
<!-- 15: tall grass with a few pale seed heads -->
<g transform="translate(192 32)" fill="none" stroke-linecap="round"><path d="M8 30q0-15-5-21m5 21q4-14 10-21m-10 21q7-9 15-10m0 10q-1-13 6-18" stroke="#39834b" stroke-width="2.4"/><path d="M2 8l-2-2m13-1 2-3m10 13 3-3" stroke="#e0d487" stroke-width="2"/></g>
<!-- 16: bridge decking for map-editor compatibility -->
<g transform="translate(224 32)"><rect x="1" y="3" width="30" height="26" rx="3" fill="#bd8050" stroke="#65463a" stroke-width="2"/><path d="M4 8h24M4 14h24M4 20h24M4 26h24" stroke="#e3b271" stroke-width="1.6"/><path d="M9 4v24m8-24v24m8-24v24" stroke="#8d5c42" stroke-width="1.4"/></g>
