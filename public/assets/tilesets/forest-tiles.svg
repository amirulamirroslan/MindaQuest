<g transform="translate(64 0)"><ellipse cx="16" cy="29" rx="13" ry="2.5" fill="#367d45" opacity=".55"/><use href="#fern" transform="translate(-7 1) scale(.9)"/><use href="#whiteflower" transform="translate(4 6) scale(.55)"/></g>
<!-- 4: rounded storybook stone -->
<g transform="translate(96 0)"><ellipse cx="17" cy="28" rx="13" ry="3" fill="#327a45" opacity=".52"/><path d="M4 24q-1-5 4-8l3-8q4-5 9-3 6-3 9 4 5 2 4 8l-3 8H8z" fill="url(#stone)" stroke="#526653" stroke-width="1.5"/><path d="M11 11q3-4 7-3m5 7 4 1m-17 5h4" fill="none" stroke="#dbe0bc" stroke-width="2" stroke-linecap="round"/></g>
<!-- 5: low, layered fern bush -->
<g transform="translate(128 0)"><ellipse cx="16" cy="28" rx="13" ry="3" fill="#286d45" opacity=".56"/><path d="M3 25q-2-7 5-9 0-8 8-8 6-5 11 2 6 0 6 8 4 5 0 10H6z" fill="url(#leaf)" stroke="#236744" stroke-width="1.6"/><path d="M7 20q5-7 10-3 4-8 9-5M7 24q6-5 11-2 4-6 9-3" fill="none" stroke="#9add75" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="13" r="2" fill="#b5e985"/></g>
<!-- 6: fine meadow grass -->
<g transform="translate(160 0)" fill="none" stroke-linecap="round"><path d="M8 30q1-12-5-17m5 17q5-13 10-18m-10 18q8-8 14-9m2 9q-1-10 5-15" stroke="#347f45" stroke-width="2.4"/><path d="M5 14l-3-2m12-3 2-3m10 8 3-3" stroke="#acd978" stroke-width="1.7"/></g>
<!-- 7: cheerful pink bloom -->
<g transform="translate(192 0)"><path d="M16 18v11m0-7-4-3m4 5 5-3" stroke="#398647" stroke-width="1.7"/><g fill="#f18ba8" stroke="#be607d" stroke-width=".7"><ellipse cx="16" cy="10" rx="2.6" ry="4"/><ellipse cx="16" cy="10" rx="2.6" ry="4" transform="rotate(72 16 12)"/><ellipse cx="16" cy="10" rx="2.6" ry="4" transform="rotate(144 16 12)"/><ellipse cx="16" cy="10" rx="2.6" ry="4" transform="rotate(216 16 12)"/><ellipse cx="16" cy="10" rx="2.6" ry="4" transform="rotate(288 16 12)"/></g><circle cx="16" cy="12" r="2" fill="#ffe17a"/></g>
<!-- 8: stream detail variant -->
<g transform="translate(224 0)"><path d="M0 13q8-5 16 0t16 0M-2 25q8-5 16 0t16 0" fill="none" stroke="#b8edf0" stroke-width="2" stroke-linecap="round"/><path d="M5 18h7m11 8h5" stroke="#e4f5d8" stroke-width="1.5" stroke-linecap="round"/></g>
