<g transform="translate(0 32)"><g fill="#f8d977"><circle cx="11" cy="11" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="20" cy="12" r="3"/><circle cx="15" cy="15" r="3"/></g><path d="M15 14v12" stroke="#4b9248" stroke-width="1.6"/><circle cx="27" cy="24" r="1.2" fill="#fff0ba"/></g>
