<g transform="translate(32 32)"><path d="M1 24q5-11 11-6 5-13 12-6 6 1 7 12H4z" fill="#4a9d55" stroke="#337c49" stroke-width="1.4"/><path d="M5 20q4-6 8-2m8-3q4-4 7 2" fill="none" stroke="#a2d76c" stroke-width="2" stroke-linecap="round"/><circle cx="18" cy="23" r="1.5" fill="#f1d479"/></g>
<!-- 11: three small cream blossoms -->
<g transform="translate(64 32)"><use href="#whiteflower" transform="translate(-5 5) scale(.62)"/><use href="#whiteflower" transform="translate(7 11) scale(.48)"/></g>
<!-- 12: fallen leaves -->
<g transform="translate(96 32)"><path d="M4 11q5-7 11 0-6 6-11 0m9 13q5-7 11 0-6 6-11 0m2-17q4-5 8 0-4 5-8 0" fill="#c2b96c" stroke="#6d914c" stroke-width="1.2"/><path d="M5 11h8m2 13h7" stroke="#ece29a" stroke-width="1"/></g>
