<g transform="translate(128 32)"><path d="M9 23h5v6H9zm12-1h4v7h-4z" fill="#f0d9a1"/><path d="M5 23q0-7 6-7t6 7zm14-1q0-6 5-6t5 6z" fill="#efad55" stroke="#ac7044" stroke-width="1.3"/><circle cx="10" cy="19" r="1" fill="#fff0c2"/><circle cx="23" cy="18" r=".8" fill="#fff0c2"/></g>
