<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64" shape-rendering="crispEdges">
<defs>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#b0b8a0"/><stop offset="1" stop-color="#7b8977"/></linearGradient>
 <linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#55b666"/><stop offset="1" stop-color="#278452"/></linearGradient>
 <g id="fern"><path d="M16 29q1-13-1-22M15 23l-7-5m8 0 7-6m-8 1-6-5m7 17 8-5" fill="none" stroke="#277748" stroke-width="2" stroke-linecap="round"/><path d="M8 18q4-1 7 4-5 1-7-4m9-6q0-5 5-6 0 5-5 6m-8-8q5-1 7 5-5 0-7-5m7 17q2-6 8-5-2 6-8 5" fill="#7bc95d" stroke="#3d8b4b" stroke-width="1"/></g>
 <g id="whiteflower"><path d="M16 17v11m0-7-4-3m4 5 4-3" stroke="#408a48" stroke-width="1.5"/><g fill="#fff0c7"><circle cx="16" cy="10" r="2.7"/><circle cx="11.5" cy="12.5" r="2.7"/><circle cx="20.5" cy="12.5" r="2.7"/><circle cx="13" cy="17" r="2.7"/><circle cx="19" cy="17" r="2.7"/></g><circle cx="16" cy="13.5" r="2" fill="#f4cf68"/></g>
</defs>
<!-- 1: transparent base; the continuous illustrated ground sits underneath this detail layer -->
<!-- 2: warm trail flecks, retained for map-editor compatibility -->
<g transform="translate(32 0)"><path d="M5 8h6m12 13h5M7 27h3m8-22h3" stroke="#f5dea0" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="14" r="1.3" fill="#936b46"/><circle cx="25" cy="8" r="1.2" fill="#936b46"/></g>
