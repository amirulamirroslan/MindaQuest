<svg xmlns="http://www.w3.org/2000/svg" width="160" height="192" viewBox="0 0 160 192">
<defs><linearGradient id="cape" x2="0" y2="1"><stop stop-color="#a66e48"/><stop offset="1" stop-color="#624631"/></linearGradient><linearGradient id="tunic" x2="0" y2="1"><stop stop-color="#59625a"/><stop offset="1" stop-color="#303a36"/></linearGradient><linearGradient id="hair" x2="0" y2="1"><stop stop-color="#f4d985"/><stop offset="1" stop-color="#bf8e47"/></linearGradient></defs>
<g id="hero">
 <ellipse cx="20" cy="42" rx="12" ry="3" fill="#245b48" opacity=".35"/>
 <!-- cape --> <path d="M12 21q8-4 16 0l4 17-12 4-12-4z" fill="url(#cape)" stroke="#493a32" stroke-width="1.5"/><path d="M11 35l9 4 11-4" fill="none" stroke="#e5be7b" stroke-width="1.2"/>
 <!-- boots and animated little feet --> <path d="M12 34h7v6q-1 3-7 2l-2-2zM21 34h7v6q1 3 7 2l1-3-2-3h-6z" fill="#754e42" stroke="#4d3b38" stroke-width="1.4"/><path d="M12 40h7m10 0h6" stroke="#f0c779" stroke-width="1.5"/>
 <!-- tunic --> <path d="M12 21q8-5 16 0l4 15q-11 5-24 0z" fill="url(#tunic)" stroke="#252e2b" stroke-width="1.7"/><path d="M17 24h7v7h-7z" fill="#eac66f" stroke="#986b43" stroke-width="1"/><circle cx="20.5" cy="27.5" r="1.4" fill="#fff0a2"/>
 <!-- arms --> <path d="M12 23q-4 3-4 9l4 1 3-7m13-3q4 3 4 9l-4 1-3-7" fill="#e7a56f" stroke="#805747" stroke-width="1.4" stroke-linejoin="round"/>
 <!-- head --> <path d="M12 9q0-7 8-8 9 1 9 9v7q-2 7-9 7-7-1-8-8z" fill="#f1bb86" stroke="#7d5145" stroke-width="1.6"/><path d="M10 11q-2-9 8-10 11 0 12 8l-4 1-3-4q-4 4-12 4z" fill="url(#hair)" stroke="#8e6a40" stroke-width="1.4"/><path d="M12 10q5 1 11-3" fill="none" stroke="#fff0b0" stroke-width="1.4"/><path d="M21 2q4-3 7 1l-3 4" fill="none" stroke="#f3d78b" stroke-width="2" stroke-linecap="round"/>
 <circle cx="16" cy="15" r="1.2" fill="#263e42"/><circle cx="24" cy="15" r="1.2" fill="#263e42"/><path d="M17 19q3 2 6 0" fill="none" stroke="#b65f53" stroke-width="1.3" stroke-linecap="round"/>
 <path d="M14 22q2 3 5 4" fill="none" stroke="#ffe0a3" stroke-width="1.2"/>
</g>
<!-- 4-frame walk cycle, front, left, right, back -->
<use href="#hero" x="0" y="0"/>
<use href="#hero" x="40" y="0" transform="translate(80 0) scale(-1 1)"/>
<use href="#hero" x="80" y="0" transform="translate(160 0) scale(-1 1)"/>
<g transform="translate(120 0)"><use href="#hero"/><path d="M8 13q12-3 24 0" fill="none" stroke="#62493e" stroke-width="3"/></g>
<g transform="translate(0 48)"><use href="#hero"/><path d="M12 37l-2 4m15-4 4 4" stroke="#f1bb86" stroke-width="2"/></g>
<g transform="translate(40 48)"><use href="#hero" transform="translate(40 0) scale(-1 1)"/><path d="M13 38l-3 3m17-4 2 4" stroke="#f1bb86" stroke-width="2"/></g>
<g transform="translate(80 48)"><use href="#hero" transform="translate(40 0) scale(-1 1)"/><path d="M11 39l-2 2m17-3 3 3" stroke="#f1bb86" stroke-width="2"/></g>
<g transform="translate(120 48)"><use href="#hero"/><path d="M10 13q10-4 20 0" fill="none" stroke="#62493e" stroke-width="3"/></g>
<g transform="translate(0 96)"><use href="#hero"/><path d="M11 38l2 3m13-4-2 4" stroke="#f1bb86" stroke-width="2"/></g>
<g transform="translate(40 96)"><use href="#hero" transform="translate(40 0) scale(-1 1)"/><path d="M11 39l2 2m13-3-2 3" stroke="#f1bb86" stroke-width="2"/></g>
<g transform="translate(80 96)"><use href="#hero" transform="translate(40 0) scale(-1 1)"/><path d="M11 40l2 2m13-4-2 4" stroke="#f1bb86" stroke-width="2"/></g>
<g transform="translate(120 96)"><use href="#hero"/><path d="M10 13q10-4 20 0" fill="none" stroke="#62493e" stroke-width="3"/></g>
<g transform="translate(0 144)"><use href="#hero"/></g><g transform="translate(40 144)"><use href="#hero" transform="translate(40 0) scale(-1 1)"/></g><g transform="translate(80 144)"><use href="#hero" transform="translate(40 0) scale(-1 1)"/></g><g transform="translate(120 144)"><use href="#hero"/></g>
</svg>
